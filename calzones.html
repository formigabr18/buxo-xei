
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUXO XÊI - Calzones</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --orange: #ff7b00;
    --yellow: #ffc400;
    --red: #a90000;
    --dark: #100707;
    --card: rgba(35, 15, 15, 0.95);
    --white: #fff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at top, #4b0909, #160707 55%, #080303);
    color: var(--white);
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    padding-bottom: 100px;
}

button, input, select, textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.voltar {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 100;
    background: var(--orange);
    color: #fff;
    padding: 11px 16px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 3px 12px #0008;
}

header {
    text-align: center;
    padding: 75px 15px 25px;
}

.logo {
    width: 145px;
    max-width: 45%;
    margin-bottom: 10px;
}

h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 7vw, 48px);
    color: var(--yellow);
    text-transform: uppercase;
    text-shadow: 2px 3px 5px #000;
}

.subtitulo {
    color: #f2dede;
    margin-top: 8px;
    font-size: 15px;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
}

nav a {
    text-decoration: none;
    color: white;
    background: #3b1717;
    border: 1px solid #9b3b16;
    padding: 10px 17px;
    border-radius: 25px;
    font-weight: bold;
    font-size: 13px;
}

nav a.ativo {
    background: var(--orange);
    border-color: var(--yellow);
}

.container {
    width: 92%;
    max-width: 850px;
    margin: 20px auto;
}

.aviso {
    text-align: center;
    color: #ffe1b5;
    margin: 15px 0 25px;
    font-size: 14px;
}

.secao-titulo {
    font-family: 'Montserrat', sans-serif;
    color: var(--yellow);
    font-size: 22px;
    margin: 25px 0 15px;
    text-align: center;
}

.menu-item {
    background: var(--card);
    border: 1px solid #713020;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px #0005;
}

.menu-item h3 {
    color: var(--yellow);
    font-family: 'Montserrat', sans-serif;
    font-size: 19px;
    margin-bottom: 6px;
}

.menu-item p {
    color: #e6d6d6;
    font-size: 14px;
    margin-bottom: 15px;
}

.precos {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.preco {
    background: #421919;
    border: 1px solid #8e3a20;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 14px;
}

.preco strong {
    color: var(--yellow);
}

.acoes {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.acoes select {
    flex: 1;
    min-width: 130px;
    background: #1c1010;
    color: white;
    border: 1px solid #99502b;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.btn-adicionar {
    background: linear-gradient(135deg, var(--orange), #d94400);
    border: none;
    color: white;
    font-weight: bold;
    padding: 12px 18px;
    border-radius: 9px;
    transition: .2s;
}

.btn-adicionar:active {
    transform: scale(.96);
}

.carrinho-flutuante {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 200;
    background: linear-gradient(135deg, var(--orange), #d93600);
    color: white;
    border: 2px solid var(--yellow);
    border-radius: 50px;
    padding: 15px 20px;
    font-weight: bold;
    font-size: 15px;
    box-shadow: 0 4px 15px #0009;
}

.carrinho-flutuante span {
    background: white;
    color: #a90000;
    border-radius: 50%;
    padding: 3px 7px;
    margin-left: 5px;
}

.painel-carrinho {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: #000b;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.painel-carrinho.aberto {
    display: flex;
}

.conteudo-carrinho {
    background: #1d0b0b;
    border: 1px solid #a94a21;
    border-radius: 16px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 5px 25px #000;
}

.topo-carrinho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.topo-carrinho h2 {
    color: var(--yellow);
    font-family: 'Montserrat', sans-serif;
}

.fechar {
    background: transparent;
    border: none;
    color: white;
    font-size: 28px;
}

.item-carrinho {
    border-bottom: 1px solid #653020;
    padding: 12px 0;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.item-carrinho strong {
    color: var(--yellow);
}

.item-carrinho small {
    display: block;
    color: #d7c3c3;
    margin-top: 4px;
}

.remover {
    background: #8f1717;
    border: none;
    color: white;
    border-radius: 7px;
    padding: 7px 10px;
    align-self: center;
}

.campo {
    margin-top: 14px;
}

.campo label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    color: #ffe0b5;
    font-size: 14px;
}

.campo input,
.campo select,
.campo textarea {
    width: 100%;
    background: #100707;
    color: white;
    border: 1px solid #85412a;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.campo textarea {
    resize: vertical;
    min-height: 65px;
}

.cupom-linha {
    display: flex;
    gap: 8px;
}

.cupom-linha input {
    flex: 1;
    min-width: 0;
}

.btn-cupom {
    background: #9c2d0b;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    padding: 0 13px;
}

#mensagemCupom {
    font-size: 12px;
    margin-top: 6px;
}

.resumo {
    border-top: 1px solid #75402b;
    margin-top: 18px;
    padding-top: 15px;
}

.linha-total {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

.linha-total.total {
    font-size: 20px;
    color: var(--yellow);
    font-weight: bold;
    border-top: 1px solid #75402b;
    padding-top: 12px;
    margin-top: 12px;
}

.btn-finalizar {
    width: 100%;
    background: #168b42;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 18px;
}

.vazio {
    color: #d9c5c5;
    text-align: center;
    padding: 20px 0;
}

footer {
    text-align: center;
    color: #bda6a6;
    font-size: 12px;
    padding: 30px 15px;
}

@media (max-width: 450px) {
    .menu-item {
        padding: 15px;
    }

    .acoes {
        flex-direction: column;
        align-items: stretch;
    }

    .acoes select,
    .btn-adicionar {
        width: 100%;
    }

    .voltar {
        font-size: 12px;
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<a href="index.html" class="voltar">← Início</a>

<header>
    <!-- Se o nome do arquivo da sua logo for diferente, altere aqui -->
    <img src="logo.png" alt="Buxo Xêi" class="logo">

    <h1>Calzones</h1>
    <p class="subtitulo">Sabor de verdade em cada pedaço!</p>
</header>

<nav>
    <a href="pizzas.html">Pizzas</a>
    <a href="bolos.html">Bolos e Tortas</a>
    <a href="calzones.html" class="ativo">Calzones</a>
</nav>

<main class="container">

    <p class="aviso">
        Escolha seu sabor e tamanho e adicione ao carrinho.
    </p>

    <h2 class="secao-titulo">Nossos Calzones</h2>

    <div id="listaCalzones"></div>

</main>

<footer>
    BUXO XÊI • Feito com carinho para você!
</footer>

<button class="carrinho-flutuante" onclick="abrirCarrinho()">
    🛒 Carrinho <span id="quantidadeCarrinho">0</span>
</button>

<div class="painel-carrinho" id="painelCarrinho">
    <div class="conteudo-carrinho">

        <div class="topo-carrinho">
            <h2>Meu carrinho</h2>
            <button class="fechar" onclick="fecharCarrinho()">×</button>
        </div>

        <div id="itensCarrinho"></div>

        <div class="campo">
            <label for="nomeCliente">Seu nome</label>
            <input type="text" id="nomeCliente" placeholder="Digite seu nome">
        </div>

        <div class="campo">
            <label for="enderecoCliente">Endereço para entrega</label>
            <textarea id="enderecoCliente" placeholder="Rua, número, bairro e ponto de referência"></textarea>
        </div>

        <div class="campo">
            <label for="cupom">Cupom de desconto</label>
            <div class="cupom-linha">
                <input type="text" id="cupom" placeholder="Digite seu cupom">
                <button class="btn-cupom" onclick="aplicarCupom()">Aplicar</button>
            </div>
            <p id="mensagemCupom"></p>
        </div>

        <div class="campo">
            <label for="pagamento">Forma de pagamento</label>
            <select id="pagamento">
                <option value="">Selecione</option>
                <option value="Pix">Pix</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão de crédito">Cartão de crédito</option>
                <option value="Cartão de débito">Cartão de débito</option>
            </select>
        </div>

        <div class="campo" id="campoTroco" style="display:none;">
            <label for="troco">Precisa de troco para quanto?</label>
            <input type="text" id="troco" placeholder="Ex.: R$ 50,00">
        </div>

        <div class="resumo">
            <div class="linha-total">
                <span>Subtotal</span>
                <strong id="subtotal">R$ 0,00</strong>
            </div>

            <div class="linha-total">
                <span>Desconto</span>
                <strong id="desconto">R$ 0,00</strong>
            </div>

            <div class="linha-total total">
                <span>Total</span>
                <strong id="total">R$ 0,00</strong>
            </div>
        </div>

        <button class="btn-finalizar" onclick="finalizarPedido()">
            Finalizar pelo WhatsApp
        </button>

    </div>
</div>

<script>
const sabores = [
    "Frango",
    "Mista",
    "Calabresa",
    "3 Queijos",
    "Carne"
];

const precos = {
    P: 15.00,
    M: 22.00
};

const CHAVE_CARRINHO = "buxoCart";
const CHAVE_DESCONTO = "buxoDiscount";

let carrinho = JSON.parse(localStorage.getItem(CHAVE_CARRINHO) || "[]");
let descontoAtivo = Number(localStorage.getItem(CHAVE_DESCONTO) || 0);

const telefoneWhatsApp = "558496955210";

function dinheiro(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function carregarCalzones() {
    const lista = document.getElementById("listaCalzones");

    lista.innerHTML = sabores.map((sabor, indice) => `
        <article class="menu-item">
            <h3>${sabor}</h3>
            <p>Calzone preparado com massa especial e recheio saboroso.</p>

            <div class="precos">
                <div class="preco">
                    P: <strong>${dinheiro(precos.P)}</strong>
                </div>
                <div class="preco">
                    M: <strong>${dinheiro(precos.M)}</strong>
                </div>
            </div>

            <div class="acoes">
                <select id="tamanho-${indice}">
                    <option value="P">Tamanho P - R$ 15,00</option>
                    <option value="M">Tamanho M - R$ 22,00</option>
                </select>

                <button class="btn-adicionar"
                    onclick="adicionarCarrinho('${sabor}', ${indice})">
                    Adicionar
                </button>
            </div>
        </article>
    `).join("");
}

function salvarCarrinho() {
    localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho));
    localStorage.setItem(CHAVE_DESCONTO, String(descontoAtivo));
}

function adicionarCarrinho(sabor, indice) {
    const tamanho = document.getElementById(`tamanho-${indice}`).value;
    const preco = precos[tamanho];

    const existente = carrinho.find(item =>
        item.nome === `Calzone ${sabor}` &&
        item.tamanho === tamanho
    );

    if (existente) {
        existente.quantidade = (Number(existente.quantidade) || 1) + 1;
    } else {
        carrinho.push({
            nome: `Calzone ${sabor}`,
            tamanho: tamanho,
            preco: preco,
            quantidade: 1
        });
    }

    salvarCarrinho();
    atualizarCarrinho();

    alert(`Calzone de ${sabor} adicionado ao carrinho!`);
}

function removerItem(indice) {
    carrinho.splice(indice, 1);

    if (carrinho.length === 0) {
        descontoAtivo = 0;
        localStorage.removeItem(CHAVE_DESCONTO);
    }

    salvarCarrinho();
    atualizarCarrinho();
}

function calcularSubtotal() {
    return carrinho.reduce((total, item) => {
        const preco = Number(item.preco) || 0;
        const quantidade = Number(item.quantidade) || 1;
        return total + (preco * quantidade);
    }, 0);
}

function atualizarCarrinho() {
    const lista = document.getElementById("itensCarrinho");
    const quantidade = carrinho.reduce((total, item) =>
        total + (Number(item.quantidade) || 1), 0
    );

    document.getElementById("quantidadeCarrinho").textContent = quantidade;

    if (carrinho.length === 0) {
        lista.innerHTML = '<p class="vazio">Seu carrinho está vazio.</p>';
    } else {
        lista.innerHTML = carrinho.map((item, indice) => `
            <div class="item-carrinho">
                <div>
                    <strong>${item.nome}</strong>
                    <small>
                        Tamanho ${item.tamanho} •
                        ${item.quantidade || 1} unidade(s)
                    </small>
                    <small>
                        ${dinheiro((Number(item.preco) || 0) *
                        (Number(item.quantidade) || 1))}
                    </small>
                </div>

                <button class="remover" onclick="removerItem(${indice})">
                    Remover
                </button>
            </div>
        `).join("");
    }

    const subtotal = calcularSubtotal();
    const desconto = subtotal * descontoAtivo;
    const total = subtotal - desconto;

    document.getElementById("subtotal").textContent = dinheiro(subtotal);
    document.getElementById("desconto").textContent = dinheiro(desconto);
    document.getElementById("total").textContent = dinheiro(total);
}

function abrirCarrinho() {
    document.getElementById("painelCarrinho").classList.add("aberto");
    atualizarCarrinho();
}

function fecharCarrinho() {
    document.getElementById("painelCarrinho").classList.remove("aberto");
}

function aplicarCupom() {
    const cupom = document.getElementById("cupom").value.trim().toUpperCase();
    const mensagem = document.getElementById("mensagemCupom");

    if (carrinho.length === 0) {
        mensagem.style.color = "#ff7777";
        mensagem.textContent = "Adicione algum produto antes de usar o cupom.";
        return;
    }

    if (cupom === "KAR5" || cupom === "GEN5") {
        descontoAtivo = 0.05;
        mensagem.style.color = "#65e88c";
        mensagem.textContent = "Cupom aplicado! Você ganhou 5% de desconto.";
    } else {
        descontoAtivo = 0;
        mensagem.style.color = "#ff7777";
        mensagem.textContent = "Cupom inválido.";
    }

    salvarCarrinho();
    atualizarCarrinho();
}

document.getElementById("pagamento").addEventListener("change", function() {
    document.getElementById("campoTroco").style.display =
        this.value === "Dinheiro" ? "block" : "none";
});

function finalizarPedido() {
    if (carrinho.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
    }

    const nome = document.getElementById("nomeCliente").value.trim();
    const endereco = document.getElementById("enderecoCliente").value.trim();
    const pagamento = document.getElementById("pagamento").value;
    const troco = document.getElementById("troco").value.trim();

    if (!nome || !endereco || !pagamento) {
        alert("Preencha seu nome, endereço e forma de pagamento.");
        return;
    }

    if (pagamento === "Dinheiro" && !troco) {
        if (!confirm("Você não informou o valor do troco. Deseja continuar?")) {
            return;
        }
    }

    const subtotal = calcularSubtotal();
    const valorDesconto = subtotal * descontoAtivo;
    const total = subtotal - valorDesconto;

    let mensagem = "🍕 *NOVO PEDIDO - BUXO XÊI* 🍕\n\n";

    mensagem += `👤 *Nome:* ${nome}\n`;
    mensagem += `📍 *Endereço:* ${endereco}\n\n`;
    mensagem += "*PEDIDO:*\n";

    carrinho.forEach(item => {
        const quantidade = Number(item.quantidade) || 1;
        const precoTotal = (Number(item.preco) || 0) * quantidade;

        mensagem += `• ${item.nome} - Tamanho ${item.tamanho}`;
        mensagem += ` (${quantidade}x) - ${dinheiro(precoTotal)}\n`;
    });

    mensagem += `\nSubtotal: ${dinheiro(subtotal)}\n`;
    mensagem += `Desconto: ${dinheiro(valorDesconto)}\n`;
    mensagem += `*TOTAL: ${dinheiro(total)}*\n\n`;
    mensagem += `💳 *Pagamento:* ${pagamento}\n`;

    if (pagamento === "Dinheiro" && troco) {
        mensagem += `💵 *Troco para:* ${troco}\n`;
    }

    mensagem += "\nAguardo a confirmação do pedido!";

    const url = `https://wa.me/${telefoneWhatsApp}?text=${encodeURIComponent(mensagem)}`;

    window.open(url, "_blank");
}

carregarCalzones();
atualizarCarrinho();
</script>

</body>
</html>
